<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Where share-preview lives. Local stack below; the live checklist sets the project's functions URL. -->
    <meta name="hitlist-functions-url" content="http://127.0.0.1:54321/functions/v1" />
    <!-- The token is in the fragment, which no request carries; never send this URL as a referrer either. -->
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src https: http:; connect-src https: http:; base-uri 'none'; form-action 'none'"
    />
    <meta name="robots" content="noindex" />
    <title>HitList</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #111;
        --muted: #666;
        --card: #fff;
        --bg: #f2f2f7;
        --line: #d1d1d6;
        --blue: #007aff;
        --button: #0060df; /* white text on it is 4.5:1 or more, in both schemes */
        --red: #d70015;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f2f2f7;
          --muted: #a1a1a6;
          --card: #1c1c1e;
          --bg: #000;
          --line: #38383a;
          --blue: #0a84ff;
          --red: #ff453a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 18px;
        margin: 0 0 6px;
        overflow-wrap: anywhere;
      }
      .muted {
        color: var(--muted);
        margin: 0 0 16px;
      }
      .card {
        background: var(--card);
        border-radius: 12px;
        padding: 16px;
        margin: 0 0 16px;
      }
      .tags {
        margin: 0 0 4px;
      }
      .stopped {
        color: var(--red);
        font-weight: 600;
      }
      .notes {
        margin: 8px 0 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .photos {
        display: grid;
        gap: 4px;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        margin: 12px 0 0;
      }
      .photos img {
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        border-radius: 6px;
        background: var(--line);
      }
      .links {
        display: flex;
        gap: 16px;
        margin: 12px 0 0;
      }
      a {
        color: var(--blue);
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--button);
        border: 0;
        border-radius: 10px;
        padding: 12px 16px;
        width: 100%;
      }
      footer p {
        margin: 12px 0 0;
      }
    </style>
    <script src="share.js" defer></script>
  </head>
  <body>
    <main id="app" aria-live="polite">
      <p class="muted">Loading…</p>
    </main>
  </body>
</html>
